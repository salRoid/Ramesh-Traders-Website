# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name store.salroid.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name store.salroid.me;

    ssl_certificate     /etc/letsencrypt/live/store.salroid.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.salroid.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Uploaded media (hero, campaigns, product photos) is served by the RT
    # backend, but under THIS host — the admin host (biz.salroid.me) is
    # noindex/nofollow and must never appear in a public page.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Deliberately no `expires` here: the backend sets Cache-Control per
        # directory (immutable for content-addressed item photos, short + SWR
        # for hero/campaign images that are overwritten in place). A blanket
        # rule here would pin a replaced hero image for the whole window.
    }

    location / {
        proxy_pass http://127.0.0.1:6410;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
